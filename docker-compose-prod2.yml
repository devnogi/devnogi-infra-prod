services:
  # MySQL
  mysql:
    image: mysql:8.0.42
    container_name: devnogi-mysql
    restart: unless-stopped
    env_file:
      - .env.infra2
    ports:
      - "127.0.0.1:3316:3316"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      LANG: C.UTF_8
      TZ: Asia/Seoul
    volumes:
      - /opt/mysql/data:/var/lib/mysql
    networks:
      - devnogi-network
    command:
      - --port=3316
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --skip-character-set-client-handshake
      - --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --default-time-zone=+09:00
      - --explicit_defaults_for_timestamp=1
      - --binlog-expire-logs-seconds=86400
      - --max-binlog-size=100M
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-P", "3316" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:8.4.0
    container_name: redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6389:6389"
    command: ["redis-server", "--port", "6389", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - devnogi-network
    volumes:
      - /opt/infra/redis-data:/data

  # Kafka (single-node KRaft)
  kafka:
    image: ${KAFKA_IMAGE}
    container_name: kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9102:9102"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9103
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9102,CONTROLLER://0.0.0.0:9103
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9102
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - /opt/kafka/data:/var/lib/kafka/data
    networks:
      - devnogi-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-init:
    image: ${KAFKA_IMAGE}
    container_name: kafka-init
    restart: "no"
    profiles: ["bootstrap"]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for topic in USER_INFO_UPDATE_EVENT USER_VERIFICATION_VERIFY_EVENT USER_INFO_UPDATE_EVENT.DLT; do
          kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$$topic" --partitions 1 --replication-factor 1
        done
    networks:
      - devnogi-network

  kafka-ui:
    image: ${KAFKA_UI_IMAGE}
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT}:${KAFKA_UI_PORT}"
    environment:
      TZ: ${KAFKA_UI_TZ}
      LANG: ${KAFKA_UI_LANG}
      LC_ALL: ${KAFKA_UI_LANG}
      JAVA_TOOL_OPTIONS: ${KAFKA_UI_JAVA_TOOL_OPTIONS}
      SERVER_PORT: ${KAFKA_UI_PORT}
      DYNAMIC_CONFIG_ENABLED: "false"
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USERNAME}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD}
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_UI_CLUSTER_NAME}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
    networks:
      - devnogi-network

  # MinIO object storage
  minio:
    image: ${MINIO_IMAGE}
    container_name: minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9001:9001"
      - "127.0.0.1:9000:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL}
    volumes:
      - /opt/infra/minio-data:/data
    command: server /data --address ":9001" --console-address ":9000"
    networks:
      - devnogi-network
    healthcheck:
      test: ["CMD-SHELL", "MC_HOST_health=\"http://$$MINIO_ROOT_USER:$$MINIO_ROOT_PASSWORD@localhost:9001\" mc ready health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  minio-init:
    image: ${MINIO_IMAGE}
    container_name: minio-init
    restart: "no"
    profiles: ["bootstrap"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      AUTH_MINIO_ACCESS_KEY: ${AUTH_MINIO_ACCESS_KEY}
      AUTH_MINIO_SECRET_KEY: ${AUTH_MINIO_SECRET_KEY}
      AUTH_MINIO_BUCKET: ${AUTH_MINIO_BUCKET}
      COMMUNITY_MINIO_ACCESS_KEY: ${COMMUNITY_MINIO_ACCESS_KEY}
      COMMUNITY_MINIO_SECRET_KEY: ${COMMUNITY_MINIO_SECRET_KEY}
      COMMUNITY_MINIO_BUCKET: ${COMMUNITY_MINIO_BUCKET}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export MC_HOST_prod="http://$$MINIO_ROOT_USER:$$MINIO_ROOT_PASSWORD@minio:9001"
        mc ready prod >/dev/null
        mc mb --ignore-existing "prod/$$AUTH_MINIO_BUCKET" >/dev/null
        mc mb --ignore-existing "prod/$$COMMUNITY_MINIO_BUCKET" >/dev/null
        mc anonymous set download "prod/$$AUTH_MINIO_BUCKET" >/dev/null
        mc anonymous set none "prod/$$COMMUNITY_MINIO_BUCKET" >/dev/null
        printf '%s\n' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::'"$$AUTH_MINIO_BUCKET"'"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::'"$$AUTH_MINIO_BUCKET"'/*"]}]}' > /tmp/auth-policy.json
        printf '%s\n' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket"],"Resource":["arn:aws:s3:::'"$$COMMUNITY_MINIO_BUCKET"'"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::'"$$COMMUNITY_MINIO_BUCKET"'/*"]}]}' > /tmp/community-policy.json
        # policy create overwrites an existing named policy; user add updates an existing user's secret.
        mc admin policy create prod auth-profile-rw /tmp/auth-policy.json >/dev/null
        mc admin policy create prod community-media-rw /tmp/community-policy.json >/dev/null
        printf '%s\n%s\n' "$$AUTH_MINIO_ACCESS_KEY" "$$AUTH_MINIO_SECRET_KEY" | mc admin user add prod >/dev/null
        printf '%s\n%s\n' "$$COMMUNITY_MINIO_ACCESS_KEY" "$$COMMUNITY_MINIO_SECRET_KEY" | mc admin user add prod >/dev/null
        mc admin policy attach prod auth-profile-rw --user "$$AUTH_MINIO_ACCESS_KEY" >/dev/null
        mc admin policy attach prod community-media-rw --user "$$COMMUNITY_MINIO_ACCESS_KEY" >/dev/null
        rm -f /tmp/auth-policy.json /tmp/community-policy.json
    networks:
      - devnogi-network

  # AuthHeal
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal-prod-2
    restart: unless-stopped
    environment:
      AUTOHEAL_INTERVAL: ${AUTOHEAL_INTERVAL}
      AUTOHEAL_START_PERIOD: ${AUTOHEAL_START_PERIOD}
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: ${AUTOHEAL_DEFAULT_STOP_TIMEOUT}
      DOCKER_SOCK: /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - devnogi-network
    deploy:
      resources:
        limits:
          memory: ${AUTOHEAL_MEMORY_LIMIT}
        reservations:
          memory: ${AUTOHEAL_MEMORY_RESERVATION}

networks:
  devnogi-network:
    driver: bridge
