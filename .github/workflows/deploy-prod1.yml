name: Deploy to On-Premise 1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-production-server1
  cancel-in-progress: false

jobs:
  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose to Server 1
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.PROD1_HOST }}
          username: ${{ secrets.PROD1_USER }}
          key: ${{ secrets.PROD1_PEM_KEY }}
          port: ${{ secrets.PROD1_SSH_PORT }}
          source: "docker-compose-prod1.yml"
          target: "/opt/infra/incoming1/"

      - name: Create .env and Execute Docker
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD1_HOST }}
          username: ${{ secrets.PROD1_USER }}
          key: ${{ secrets.PROD1_PEM_KEY }}
          port: ${{ secrets.PROD1_SSH_PORT }}
          script: |
            set -eu
            umask 077
            mkdir -p /opt/infra
            cd /opt/infra
            test -s docker-compose-prod1.yml
            test -s .env.infra1
            cp docker-compose-prod1.yml .previous-compose-prod1.yml
            cp .env.infra1 .previous-env-prod1
            
            cat << 'EOF' > .next-env-infra1
            ${{ secrets.PROD1_ENV_FILE }}
            EOF
            services=$(docker compose -f .previous-compose-prod1.yml --env-file .env.infra1 config --services)
            test -n "$services" || { echo 'No services available for rollback' >&2; exit 1; }
            printf 'services:\n' > .previous-images-prod1.yml
            for service in $services; do
              containers=$(docker compose -f .previous-compose-prod1.yml --env-file .env.infra1 ps --all -q "$service")
              set -- $containers
              [ "$#" -eq 1 ] || { echo "Expected one prior container for $service" >&2; exit 1; }
              image=$(docker inspect --format '{{.Image}}' "$1")
              test -n "$image"
              printf '  %s:\n    image: "%s"\n' "$service" "$image" >> .previous-images-prod1.yml
            done
            cp incoming1/docker-compose-prod1.yml docker-compose-prod1.yml
            cp .next-env-infra1 .env.infra1
            if docker compose -f docker-compose-prod1.yml --env-file .env.infra1 pull &&
               docker compose -f docker-compose-prod1.yml --env-file .env.infra1 up -d --wait; then
              printf '%s\n' '${{ github.sha }}' > .last-deployed-prod1-sha
            else
              cp .previous-compose-prod1.yml docker-compose-prod1.yml
              cp .previous-env-prod1 .env.infra1
              docker compose -f docker-compose-prod1.yml -f .previous-images-prod1.yml --env-file .env.infra1 up -d --wait --pull never || echo 'Rollback failed' >&2
              exit 1
            fi
