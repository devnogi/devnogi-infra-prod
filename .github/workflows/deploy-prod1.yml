name: Deploy to On-Premise 1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev-window:
    runs-on: ubuntu-latest
    steps:
      # 빠른 개선을 위한 dev 브랜치 운영 배포 허용: 2026-12-31까지 (KST)
      - name: Check temporary dev production window
        env:
          DEPLOY_REF: ${{ github.ref }}
        run: |
          if [[ "$DEPLOY_REF" != "refs/heads/main" && "$DEPLOY_REF" != "refs/heads/dev" ]]; then
            echo "Production deployment requires main or dev." >&2
            exit 1
          fi
          if [[ "$DEPLOY_REF" == "refs/heads/dev" ]] &&
             [[ "$(date -u +%s)" -ge "$(date -u -d '2026-12-31 15:00:00 UTC' +%s)" ]]; then
            echo "The temporary dev production window ended at 2027-01-01 00:00 KST." >&2
            exit 1
          fi

  deploy:
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    needs: dev-window
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Recheck temporary dev production window
        if: github.ref == 'refs/heads/dev'
        run: |
          if [[ "$(date -u +%s)" -ge "$(date -u -d '2026-12-31 15:00:00 UTC' +%s)" ]]; then
            echo "The temporary dev production window expired while awaiting approval." >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Recheck temporary dev window before server access
        if: github.ref == 'refs/heads/dev'
        run: |
          if [[ "$(date -u +%s)" -ge "$(date -u -d '2026-12-31 15:00:00 UTC' +%s)" ]]; then
            echo "The temporary dev production window expired before server access." >&2
            exit 1
          fi

      - name: Copy docker-compose to Server 1
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.PROD1_HOST }}
          username: ${{ secrets.PROD1_USER }}
          key: ${{ secrets.PROD1_PEM_KEY }}
          port: ${{ secrets.PROD1_SSH_PORT }}
          source: "docker-compose-prod1.yml"
          target: "/opt/infra/"

      - name: Recheck temporary dev window before remote execution
        if: github.ref == 'refs/heads/dev'
        run: |
          if [[ "$(date -u +%s)" -ge "$(date -u -d '2026-12-31 15:00:00 UTC' +%s)" ]]; then
            echo "The temporary dev production window expired before remote execution." >&2
            exit 1
          fi

      - name: Create .env and Execute Docker
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD1_HOST }}
          username: ${{ secrets.PROD1_USER }}
          key: ${{ secrets.PROD1_PEM_KEY }}
          port: ${{ secrets.PROD1_SSH_PORT }}
          script: |
            set -e
            if [ "${{ github.ref }}" = "refs/heads/dev" ] &&
               [ "$(date -u +%s)" -ge "$(date -u -d '2026-12-31 15:00:00 UTC' +%s)" ]; then
              echo "The temporary dev production window expired before server changes." >&2
              exit 1
            fi
            mkdir -p /opt/infra
            cd /opt/infra
            
            cat << 'EOF' > .env.infra1
            ${{ secrets.PROD1_ENV_FILE }}
            EOF
            
            if [ "${{ github.ref }}" = "refs/heads/dev" ] &&
               [ "$(date -u +%s)" -ge "$(date -u -d '2026-12-31 15:00:00 UTC' +%s)" ]; then
              echo "The temporary dev production window expired before image pull." >&2
              exit 1
            fi
            docker compose -f docker-compose-prod1.yml --env-file .env.infra1 pull
            if [ "${{ github.ref }}" = "refs/heads/dev" ] &&
               [ "$(date -u +%s)" -ge "$(date -u -d '2026-12-31 15:00:00 UTC' +%s)" ]; then
              echo "The temporary dev production window expired before restart." >&2
              exit 1
            fi
            docker compose -f docker-compose-prod1.yml --env-file .env.infra1 up -d
            
            docker image prune -f
