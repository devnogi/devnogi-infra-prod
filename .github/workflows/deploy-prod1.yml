name: Deploy to On-Premise 1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-production-server1
  cancel-in-progress: false

jobs:
  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy with native Ed25519 SSH
        env:
          PROD_HOST: ${{ secrets.PROD1_HOST }}
          PROD_USER: ${{ secrets.PROD1_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD1_SSH_PORT }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD1_PEM_KEY }}
          PROD_HOST_FINGERPRINT: ${{ secrets.PROD1_HOST_FINGERPRINT }}
          PROD_ENV_FILE: ${{ secrets.PROD1_ENV_FILE }}
        run: bash scripts/deploy-prod-native.sh 1 "$GITHUB_SHA" "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
