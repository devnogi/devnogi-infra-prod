name: devnogi-local-infra

services:
  mysql:
    image: mysql:8.0.42
    ports:
      - "127.0.0.1:3316:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local-root-only}
      MYSQL_DATABASE: devnogi
      MYSQL_USER: ${DB_USER:-devnogi}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-dev-only}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      default:
        aliases: [devnogi-local-mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8.4.0
    ports:
      - "127.0.0.1:6389:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-local-redis-only}"]
    volumes:
      - redis-data:/data
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    ports:
      - "127.0.0.1:9102:9102"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9103
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9102,CONTROLLER://0.0.0.0:9103
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://devnogi-local-kafka:29092,EXTERNAL://localhost:9102
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      default:
        aliases: [devnogi-local-kafka]
  minio:
    image: minio/minio:latest
    ports:
      - "127.0.0.1:9001:9001"
      - "127.0.0.1:9000:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-devnogi-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-only}
    command: server /data --address :9001 --console-address :9000
    volumes:
      - minio-data:/data

networks:
  default:
    name: memonogi-local

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  minio-data:
