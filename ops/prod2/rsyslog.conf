# Docker rfc5424micro messages sent through /dev/log and journald arrive with
# programname=1, so match the RFC5424 APP-NAME field in rawmsg as well.
if ($programname == 'memonogi-auth' or re_match($rawmsg, '^<[0-9]+>1 [^ ]+ [^ ]+ memonogi-auth ')) then {
  action(type="omfile" file="/var/log/memonogi/auth/application.log" fileOwner="syslog" fileGroup="adm" fileCreateMode="0640")
  stop
}
if ($programname == 'memonogi-community' or re_match($rawmsg, '^<[0-9]+>1 [^ ]+ [^ ]+ memonogi-community ')) then {
  action(type="omfile" file="/var/log/memonogi/community/application.log" fileOwner="syslog" fileGroup="adm" fileCreateMode="0640")
  stop
}
