  action(type="omfile" file="/var/log/memonogi/gateway/application.log" fileOwner="syslog" fileGroup="adm" fileCreateMode="0640")
  stop
}
if ($programname == 'memonogi-react' or re_match($rawmsg, '^<[0-9]+>1 [^ ]+ [^ ]+ memonogi-react ')) then {
