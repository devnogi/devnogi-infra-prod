# Only the five explicit Docker syslog tags are routed to these files.
if $programname == 'memonogi-auth' then {
  action(type="omfile" file="/var/log/memonogi/auth/application.log" fileCreateMode="0640")
  stop
}
if $programname == 'memonogi-community' then {
  action(type="omfile" file="/var/log/memonogi/community/application.log" fileCreateMode="0640")
  stop
}
if $programname == 'memonogi-batch' then {
  action(type="omfile" file="/var/log/memonogi/batch/application.log" fileCreateMode="0640")
  stop
}
if $programname == 'memonogi-gateway' then {
  action(type="omfile" file="/var/log/memonogi/gateway/application.log" fileCreateMode="0640")
  stop
}
if $programname == 'memonogi-react' then {
  action(type="omfile" file="/var/log/memonogi/react/application.log" fileCreateMode="0640")
  stop
}
