/var/log/memonogi/*/application.log {
    daily
    missingok
    notifempty
    dateext
    dateformat -%Y%m%d
    compress
    delaycompress
    # Cleanup is performed only after upload verification, never by logrotate.
    rotate -1
    create 0640 syslog adm
    sharedscripts
    postrotate
        /usr/lib/rsyslog/rsyslog-rotate
    endscript
}
