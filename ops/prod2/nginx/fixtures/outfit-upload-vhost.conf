# Synthetic configuration used only by scripts/verify-nginx.mjs.
# It proves the reviewed server-context fragment parses without copying
# production hostnames, certificate paths, or upstream addresses into Git.
worker_processes 1;
pid /tmp/memonogi-nginx.pid;

events {
    worker_connections 16;
}

http {
    access_log off;
    error_log stderr notice;

    server {
        listen 8080;
        server_name memonogi.invalid;

        include /etc/nginx/memonogi/outfit-upload-server.conf;

        location / {
            proxy_pass http://127.0.0.1:18080;
        }
    }
}
