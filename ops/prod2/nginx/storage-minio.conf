server {
    listen 80;
    listen [::]:80;
    server_name storage.memonogi.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name storage.memonogi.com;

    # Root creates this host-only file with the already verified certificate paths
    # and the site's established TLS policy before running the installer.
    include /etc/nginx/snippets/memonogi-storage-tls.conf;

    ignore_invalid_headers off;
    client_max_body_size 50m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:9001;
    }
}
