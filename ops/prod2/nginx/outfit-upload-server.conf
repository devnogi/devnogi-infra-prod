# Include once in the existing public application server block.
# Keep the current server_name, TLS, headers, and proxy locations unchanged.
client_max_body_size 30m;
client_body_timeout 150s;
proxy_send_timeout 150s;
proxy_read_timeout 150s;

error_page 413 = @outfit_payload_too_large;

location @outfit_payload_too_large {
    default_type application/json;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    return 413 '{"code":"OUTFIT_PAYLOAD_TOO_LARGE","message":"Upload payload exceeds the 30 MiB gateway limit."}';
}
